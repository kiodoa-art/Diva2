yt", "Reagerer overdrevet voldsomt på kritik", "Perfektionisme"]}}, "patientInfo": "Ved hjælp af dette interview undersøges det, om du har oplevet symptomer på ADHD i barndommen såvel som i voksenalderen. Spørgsmålene er baseret på de officielle diagnosekriterier for ADHD i DSM-IV. For hvert kriterium vil du blive spurgt, om du kan genkende problemet. For at hjælpe dig under interviewet vil jeg løbende give dig eksempler, der beskriver, hvordan ADHD symptomerne kan komme til udtryk som problemer for henholdsvis børn og voksne. Spørgsmålene vil først blive stillet til dig, og bagefter vil de samme spørgsmål blive stillet til din eventuelle partner og familiemedlemmer. Din partner har sandsynligvis kun kendt dig som voksen og vil blive spurgt om denne periode, mens din familie nok kan fortælle mere om din adfærd i barndommen. Det er nødvendigt at belyse begge livsfaser for at kunne stille diagnosen ADHD.", "interviewerInfo": "Symptomerne i voksenalderen skal have været til stede i mindst seks måneder før interviewet. Symptomerne i barndommen vedrører alderen 5-12 år. For at et symptom skal kunne tilskrives ADHD, skal det have et kronisk forløb og ikke kun optræde episodisk. Et symptom markeres som tilstedeværende, hvis det forekommer oftere eller mere graverende end hos andre på samme alders- og intelligensniveau, eller hvis det medfører dysfunktion. Partner og familie kan bruges som supplerende kilder, men intervieweren afgør ud fra klinisk vurdering, om hvert kriterium er opfyldt."};
